<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="main-block">
        <div id="user-block">
            <div class="page-header">
                <div class="header-logo">
                    <img id="mini-logo" src="../img/logomini.png" alt="logo-mini" />
                </div>
                <div class="header-header">Admin Dashboard</div>
                <div class="header-logout">
                    <button id="logout">logout</button>
                </div>
            </div>
            <div class="main-info">
                <div class="main-info-block" id="main-info-name-block">
                    <div class="main-info-name-part" id="main-info-status-value"></div>
                    <div class="main-info-name-part" id="main-info-name-value"></div>
                </div>
                <div class="main-info-block" id="main-info-id-block">
                    <div class="main-info-id-part" id="main-info-id-header">ID:</div>
                    <div class="main-info-id-part" id="main-info-id-value"></div>
                </div>
            </div>
            <div class="user-panel">
                <div class="left-part">
                    <div class="top-part">
                        <div class="top-part-part">
                            <div class="top-part-part-header">Käyttäjät järjestelmässä</div>
                            <div class="top-part-part-data">
                                <div class="top-part-data-row">
                                    <div class="top-part-row-header">- Potilaat:</div>
                                    <div class="top-part-row-value" id="top-part-row-patient"></div>
                                </div>
                                <div class="top-part-data-row">
                                    <div class="top-part-row-header">- Lääkärit:</div>
                                    <div class="top-part-row-value" id="top-part-row-doctor"></div>
                                </div>
                                <div class="top-part-data-row">
                                    <div class="top-part-row-header">- Ylläpitäjät:</div>
                                    <div class="top-part-row-value" id="top-part-row-admin"></div>
                                </div>
                            </div>
                        </div>
                        <div class="top-part-part">
                            <div class="top-part-part-header">Järjestelmän seuranta:</div>
                            <div class="top-part-part-data">
                                <div class="top-part-data-row">
                                    <div class="top-part-row-header">Viimeisimmät yhteydet:</div>
                                    <div class="top-part-row-value"></div>
                                </div>
                                <div class="top-part-data-row">
                                    <div class="top-part-row-header">Tietokannan käyttö:</div>
                                    <div class="top-part-row-value"></div>
                                </div>
                                <div class="top-part-data-row">
                                    <div class="top-part-row-header">Tietoturvatila:</div>
                                    <div class="top-part-row-value"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bot-part">
                        <span id="bot-part-header">Käyttäjien hallinta:</span>
                        <button class="hallinta-button" id="adm-new-user">Lisää uusi käyttäjä</button>
                        <button class="hallinta-button">Etsiä käyttäjää</button>
                    </div>
                </div>
                <div class="right-part">
                    <div id="list-of-users"></div>
                </div>
            </div>
        </div>
    </div>
    <dialog id="main-dialog">
        <div id="dia-body">
            <div id="dia-header">
                <div id="dia-header-value"></div>
                <button id="close-dialog-button">Close</button>
            </div>
            <div id="dia-main-block"></div>
        </div>
    </dialog>
</body>
<script type="module" src="/src/js/main.js"></script>
<script type="module" src="/src/js/admin.js"></script>
</html>
