<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="main-block">
        <div id="user-block">
            <div class="page-header">
                <div class="header-logo">
                    <img id="mini-logo" src="../img/logomini.png" alt="logo-mini" />
                </div>
                <div class="header-header">Doctor Dashboard</div>
                <div class="header-logout">
                    <button id="logout">logout</button>
                </div>
            </div>
            <div class="main-info">
                <div class="main-info-block" id="main-info-name-block">
                    <div class="main-info-name-part" id="main-info-status-value"></div>
                    <div class="main-info-name-part" id="main-info-name-value"></div>
                </div>
                <div class="main-info-block" id="main-info-id-block">
                    <div class="main-info-id-part" id="main-info-id-header">ID:</div>
                    <div class="main-info-id-part" id="main-info-id-value"></div>
                </div>
            </div>
            <div class="doc-buttons">
                <button class="doc-button">Luo uusi potilas</button>
                <button class="doc-button">Poista potilas</button>
            </div>
            <div id="doc-patients"></div>
        </div>
    </div>
    <dialog id="main-dialog">
        <div id="dia-body">
            <div id="dia-header">
                <div id="dia-header-value"></div>
                <button id="close-dialog-button">Close</button>
            </div>
            <div id="dia-main-block"></div>
        </div>
    </dialog>
</body>
<script type="module" src="/src/js/main.js"></script>
<script type="module" src="/src/js/doc.js"></script>
</html>
