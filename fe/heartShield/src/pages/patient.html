<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="main-block">
        <div id="user-block">
            <div class="page-header">
                <div class="header-logo">
                    <img id="mini-logo" src="../img/logomini.png" alt="logo-mini" />
                </div>
                <div class="header-header">Patient Dashboard</div>
                <div class="header-logout">
                    <button id="logout">🔓 logout</button>
                </div>
            </div>
            <div class="patient-info">
                <div class="patient-info-main">
                    <div class="patient-info-main-block">
                        <div class="sign-block">👤</div>
                        <div class="patient-info-main-header">Potilas:</div>
                        <div class="patient-info-main-value" id="patient-info-name-value"></div>
                    </div>
                    <div class="patient-info-main-block">
                        <div class="sign-block">🎂</div>
                        <div class="patient-info-main-header">Age:</div>
                        <div class="patient-info-main-value" id="patient-info-age-value"></div>
                    </div>
                    <div class="patient-info-main-block">
                        <div class="sign-block">🆔</div>
                        <div class="patient-info-main-header">Potilas ID:</div>
                        <div class="patient-info-main-value" id="patient-info-id-value"></div>
                    </div>
                </div>
                <div class="patient-info-main">
                    <div class="patient-info-main-block">
                        <div class="sign-block">📟</div>
                        <div class="patient-info-main-header">Mittari:</div>
                        <div class="patient-info-main-value" id="patient-info-mittari-value">Ei kytketty</div>
                    </div>
                    <div class="patient-info-main-block">
                        <div class="sign-block">❤️</div>
                        <div class="patient-info-main-header">Heart Rate:</div>
                        <div class="patient-info-main-value" id="patient-info-hr-value">-</div>
                    </div>
                    <div class="patient-info-main-block">
                        <div class="sign-block">📈</div>
                        <div class="patient-info-main-header">HRV Status:</div>
                        <div class="patient-info-main-value" id="patient-info-hrv-value">-</div>
                    </div>
                </div>
            </div>
            <div class="patient-buttons">
                <div class="patient-buttons-row">
                    <button class="patient-buttons-top" id="patient-buttons-hrv">🧠 Näytä HRV-kaavio yksityiskohtaisesti</button>
                </div>
                <div class="patient-buttons-row">
                    <button class="patient-buttons-bottom" id="patient-buttons-historia">📜 Katso mittaushistoria</button>
                    <button class="patient-buttons-bottom" id="patient-buttons-mittari">🔌 Mittari</button>
                    <button class="patient-buttons-bottom" id="patient-buttons-suosituksia">🩺 Lääkärin suositukset</button>
                </div>
            </div>
            <div class="patient-ai">
                <div class="patient-ai-header">💡 Viimeisin AI-suositus:</div>
                <div class="patient-ai-body">
                    <div id="patient-ai-text">Jatka nykyistä hoitoa. Poikkeavuuksia ei havaittu.</div>
                </div>
            </div>
            <div class="patient-alarm">
                <button id="patient-alarm-button">🚨Ilmoita oireista / hätätilanne</button>
            </div>
        </div>
    </div>
    <dialog id="main-dialog">
        <div id="dia-body">
            <div id="dia-header">
                <div id="dia-header-value"></div>
                <button id="close-dialog-button">🔙 Close</button>
            </div>
            <div id="dia-main-block"></div>
        </div>
    </dialog>
</body>
<script type="module" src="/src/js/main.js"></script>
<script type="module" src="/src/js/patient.js"></script>
</html>
