<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>heartShield</title>
  </head>
  <body>
    <div class="main-block">
      <div id="login-block">
        <div id="logo-div">
          <img src="src/img/logomain.png" id="main-logo" alt="logo">
          <span id="logo-p">heartShield</span>
        </div>
        <div id="input-div">
          <form class="login-form">
            <input 
            type="text"
            class="login-input"
            id="login-email"
            name="login-email"
            placeholder="email"
            required />
            <input
            type="text"
            class="login-input"
            id="login-password"
            name="login-password"
            placeholder="password"
            required />
            <input
            name="submit"
            id="login-button"
            type="submit"
            value="login" />
          </form>
        </div>
      </div>
    </div>
  </body>
<script type="module" src="/src/js/main.js"></script>
<script type="module" src="/src/js/login.js"></script>
</html>
